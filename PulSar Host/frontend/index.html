<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PulSar-Host | Game Hosting</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<div>

<h1>🌌 PulSar-Host</h1>

<p>Игровой хостинг нового поколения</p>

</div>


<div class="user">

👤 Гость

</div>


</header>




<nav class="menu">

<button>
🏠 Главная
</button>

<button>
🎮 Серверы
</button>

<button>
🎁 Промокоды
</button>

<button>
⚙️ Настройки
</button>

</nav>





<main>



<section class="stats">


<div class="card">

<h3>Статус</h3>

<p id="status">
Проверка...
</p>

</div>



<div class="card">

<h3>Серверов</h3>

<p id="serverCount">
0
</p>

</div>



<div class="card">

<h3>Версия</h3>

<p>
v1.0
</p>

</div>



</section>







<section class="panel">


<h2>
🎮 Управление серверами
</h2>



<div class="card">


<input 
id="serverName"
placeholder="Название сервера">


<input 
id="game"
placeholder="Игра">


<button onclick="createServer()">

Создать сервер

</button>



</div>







<div class="card">


<h3>
Мои серверы
</h3>


<div id="servers">

Загрузка серверов...

</div>



</div>




</section>








<section class="panel">


<h2>
🎁 Промокод
</h2>



<input 
id="promo"
placeholder="Введите промокод">


<button onclick="checkPromo()">

Активировать

</button>



<p id="promoResult"></p>


</section>







<footer>

<p>
© 2026 PulSar-Host
</p>

</footer>



</main>




<script src="app.js"></script>


</body>

</html>
